name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'tools/**', 'README.md', '.github/workflows/fetch-images.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bauen
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk 20-Dollar-Game.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: 20-Dollar-Game-APK
          path: 20-Dollar-Game.apk

      - name: Release mit APK erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 20$ Game v1.0.${{ github.run_number }}
          body: |
            📱 **20-Dollar-Game.apk** unten herunterladen und auf dem Handy installieren
            (ggf. „Installation aus unbekannten Quellen“ erlauben).
          files: 20-Dollar-Game.apk
          make_latest: true
